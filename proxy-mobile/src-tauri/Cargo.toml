[package]
name = "rama-proxy-mobile"
version = "1.4.0"
description = "Rama Proxy Android local SOCKS5 client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rama_proxy_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
proxy-core = { path = "../../proxy-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.6", features = [] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "time"] }
toml = "0.9.8"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
